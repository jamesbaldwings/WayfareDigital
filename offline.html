<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2B3A">
<title>You're offline | Wayfare Digital</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: light; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: #FAF7F0; color: #1C2B3A;
    font-family: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 440px; }
  h1 { font-family: Fraunces, Georgia, "Times New Roman", serif; font-weight: 600; font-size: 1.8rem; margin: 0 0 12px; }
  p { color: #3A4C5C; line-height: 1.6; margin: 0 0 20px; }
  button { background: #1C2B3A; color: #EFE9DC; border: 0; padding: 12px 20px; border-radius: 4px; font: inherit; font-weight: 600; cursor: pointer; }
  button:focus-visible { outline: 3px solid #B8752E; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>You're offline.</h1>
  <p>This page needs a connection. Check your signal or Wi-Fi, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
